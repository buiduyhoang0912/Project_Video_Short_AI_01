<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giỏ hàng – ShortAI</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    body { background: #f5f5f5; }
    .cart-page { max-width: 900px; margin: 0 auto; padding: 20px 16px 50px; }
    .page-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 20px; color: #222; }

    .cart-shop-box {
      background: #fff; border-radius: 12px; box-shadow: 0 1px 5px rgba(0,0,0,0.08);
      margin-bottom: 18px; overflow: hidden;
    }
    .cart-shop-title {
      background: #f8f7ff; padding: 12px 18px; font-weight: 700; font-size: 0.95rem;
      color: #6366f1; border-bottom: 1px solid #ede9fe;
      display: flex; align-items: center; gap: 8px;
    }
    .cart-item-row {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 18px; border-bottom: 1px solid #f3f3f3;
      transition: background 0.15s;
    }
    .cart-item-row:last-of-type { border-bottom: none; }
    .cart-item-row:hover { background: #fafafa; }
    .cart-item-img {
      width: 72px; height: 72px; border-radius: 8px; object-fit: cover;
      background: #f0f0f0; flex-shrink: 0;
    }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-name {
      font-size: 0.9rem; font-weight: 600; color: #222;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; margin-bottom: 4px;
    }
    .cart-item-price { font-size: 0.85rem; color: #e53e3e; font-weight: 700; }
    .cart-item-invalid { font-size: 0.75rem; color: #ef4444; font-weight: 600; margin-top: 2px; }

    .cart-qty-control { display: flex; align-items: center; gap: 0; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; }
    .cart-qty-control button {
      width: 32px; height: 32px; border: none; background: #f5f5f5; cursor: pointer;
      font-size: 1rem; font-weight: 700; color: #333; transition: background 0.15s;
    }
    .cart-qty-control button:hover { background: #e0e0e0; }
    .cart-qty-control button:disabled { opacity: 0.35; cursor: default; }
    .cart-qty-control input {
      width: 44px; height: 32px; border: none; border-left: 1px solid #ddd;
      border-right: 1px solid #ddd; text-align: center; font-size: 0.9rem; outline: none;
    }
    .cart-qty-control input::-webkit-outer-spin-button,
    .cart-qty-control input::-webkit-inner-spin-button { -webkit-appearance: none; }

    .cart-line-total { font-size: 0.95rem; font-weight: 700; color: #6366f1; min-width: 90px; text-align: right; }
    .cart-delete-btn {
      background: none; border: none; cursor: pointer; font-size: 1.2rem;
      color: #ccc; transition: color 0.15s; padding: 4px 6px; flex-shrink: 0;
    }
    .cart-delete-btn:hover { color: #ef4444; }

    .cart-shop-subtotal {
      display: flex; justify-content: flex-end; padding: 10px 18px 14px;
      font-size: 0.9rem; color: #555; gap: 8px;
    }
    .cart-shop-subtotal strong { color: #e53e3e; font-size: 1rem; }

    .cart-summary {
      background: #fff; border-radius: 12px; padding: 20px 24px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.08); position: sticky; bottom: 0;
    }
    .cart-total-row { display: flex; justify-content: space-between; margin-bottom: 16px; font-size: 1rem; }
    .cart-total-row strong { font-size: 1.3rem; color: #e53e3e; }
    .btn-checkout {
      width: 100%; padding: 14px; border: none; border-radius: 8px;
      background: #6366f1; color: #fff; font-size: 1.05rem; font-weight: 700;
      cursor: pointer; transition: background 0.18s;
    }
    .btn-checkout:hover { background: #4f46e5; }
    .btn-checkout:disabled { opacity: 0.5; cursor: not-allowed; }

    .empty-cart { text-align: center; padding: 80px 20px; color: #aaa; }
    .empty-cart .icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-cart p { font-size: 1rem; margin-bottom: 16px; }
    .empty-cart a { color: #6366f1; font-weight: 600; text-decoration: none; }

    /* Checkout modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      z-index: 1000; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #fff; border-radius: 14px; padding: 28px 28px 24px;
      width: 460px; max-width: 94vw; box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }
    .modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 18px; color: #222; }
    .modal-field { margin-bottom: 14px; }
    .modal-field label { display: block; font-size: 0.85rem; font-weight: 600; color: #555; margin-bottom: 5px; }
    .modal-field input, .modal-field textarea {
      width: 100%; border: 1px solid #ddd; border-radius: 7px; padding: 9px 12px;
      font-size: 0.92rem; outline: none; transition: border 0.2s; box-sizing: border-box;
    }
    .modal-field input:focus, .modal-field textarea:focus { border-color: #6366f1; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
    .btn-modal-cancel {
      border: 1px solid #ddd; background: #fff; border-radius: 7px; padding: 9px 20px;
      font-size: 0.9rem; cursor: pointer;
    }
    .btn-modal-confirm {
      background: #6366f1; color: #fff; border: none; border-radius: 7px; padding: 9px 24px;
      font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: background 0.18s;
    }
    .btn-modal-confirm:hover { background: #4f46e5; }

    /* Toast */
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: #333; color: #fff; padding: 12px 28px; border-radius: 30px;
      font-size: 0.95rem; z-index: 9999; opacity: 0; transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .toast.success { background: #22c55e; }
    .toast.error { background: #ef4444; }
  </style>
</head>
<body>
  <div id="app-header"></div>
  <div id="toast" class="toast"></div>

  <!-- Checkout modal -->
  <div class="modal-overlay" id="checkout-modal">
    <div class="modal-box">
      <div class="modal-title">📦 Thông tin giao hàng</div>
      <div class="modal-field">
        <label>Địa chỉ giao hàng *</label>
        <input type="text" id="delivery-address" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành" />
      </div>
      <div class="modal-field">
        <label>Số điện thoại *</label>
        <input type="text" id="delivery-phone" placeholder="0xxxxxxxxx" />
      </div>
      <div class="modal-field">
        <label>Ghi chú (tùy chọn)</label>
        <textarea id="delivery-note" rows="2" placeholder="Giao giờ hành chính, để ở bảo vệ..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-modal-cancel" id="btn-cancel-checkout">Hủy</button>
        <button class="btn-modal-confirm" id="btn-confirm-checkout">✅ Đặt hàng</button>
      </div>
    </div>
  </div>

  <div class="cart-page">
    <div class="page-title">🛒 Giỏ hàng</div>
    <div id="cart-content"></div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/cart.js"></script>
</body>
</html>
