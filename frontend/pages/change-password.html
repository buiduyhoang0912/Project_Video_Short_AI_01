<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đổi mật khẩu | ClipShop AI</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <link rel="stylesheet" href="../css/style.css?v=3">
</head>
<body data-root="../" data-auth="required">
  <header id="app-header"></header>

  <main class="container">
    <section class="card form-card">
      <h1>Đổi mật khẩu</h1>
      <form id="password-form" novalidate>
        <label for="current_password">Mật khẩu hiện tại</label>
        <input type="password" id="current_password" autocomplete="current-password">
        <div class="field-error" id="err-current_password"></div>

        <label for="new_password">Mật khẩu mới</label>
        <input type="password" id="new_password" autocomplete="new-password">
        <div class="muted">Ít nhất 8 ký tự, khác mật khẩu hiện tại.</div>
        <div class="field-error" id="err-new_password"></div>

        <label for="confirm_password">Xác nhận mật khẩu mới</label>
        <input type="password" id="confirm_password" autocomplete="new-password">
        <div class="field-error" id="err-confirm_password"></div>

        <div class="form-error" id="form-error" role="alert"></div>
        <div class="status status-ok" id="form-success" role="status" style="display:none;"></div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="btn-save">Đổi mật khẩu</button>
          <a class="btn" href="profile.html">Quay lại hồ sơ</a>
        </div>
      </form>
    </section>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js?v=3"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/change-password.js"></script>
</body>
</html>
