<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đơn hàng của tôi | ClipShop AI</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <link rel="stylesheet" href="../css/style.css?v=3">
  <link rel="stylesheet" href="../css/seller-center.css">
  <style>
    .orders-page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    .order-status-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 20px;
      border-bottom: 2px solid #e2e8f0;
    }
    .status-tab-btn {
      padding: 8px 16px;
      border: none;
      background: none;
      font-size: 14px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      border-radius: 8px;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .status-tab-btn:hover {
      color: #2563eb;
      background: #eff6ff;
    }
    .status-tab-btn.active {
      color: #2563eb;
      background: #eff6ff;
      border-bottom: 2px solid #2563eb;
      border-radius: 8px 8px 0 0;
    }
    .order-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .order-card:hover {
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
    }
    .order-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #f1f5f9;
      flex-wrap: wrap;
      gap: 10px;
    }
    .order-badge-status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-pending { background: #fef3c7; color: #b45309; }
    .badge-confirmed { background: #e0e7ff; color: #3730a3; }
    .badge-shipped { background: #e0f2fe; color: #0369a1; }
    .badge-delivered { background: #dcfce7; color: #15803d; }
    .badge-cancelled { background: #fee2e2; color: #b91c1c; }

    .order-product-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px dashed #f1f5f9;
      font-size: 14px;
    }
    .order-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 14px;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* Modal Timeline */
    .timeline-container {
      position: relative;
      padding: 20px 0 20px 32px;
      margin: 10px 0;
    }
    .timeline-container::before {
      content: '';
      position: absolute;
      left: 12px;
      top: 24px;
      bottom: 24px;
      width: 3px;
      background: #e2e8f0;
    }
    .timeline-step {
      position: relative;
      margin-bottom: 22px;
    }
    .timeline-step:last-child {
      margin-bottom: 0;
    }
    .timeline-node {
      position: absolute;
      left: -32px;
      top: 2px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #cbd5e1;
      border: 3px solid #fff;
      box-shadow: 0 0 0 2px #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #fff;
    }
    .timeline-step.completed .timeline-node {
      background: #22c55e;
      box-shadow: 0 0 0 2px #22c55e;
    }
    .timeline-step.current .timeline-node {
      background: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.4);
      animation: pulse 1.8s infinite;
    }
    .timeline-step.cancelled .timeline-node {
      background: #ef4444;
      box-shadow: 0 0 0 2px #ef4444;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.5); }
      70% { box-shadow: 0 0 0 8px rgba(37, 99, 235, 0); }
      100% { box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.5); }
    }
    .timeline-content strong {
      display: block;
      font-size: 14px;
      color: #1e293b;
    }
    .timeline-content p {
      margin: 2px 0 0;
      font-size: 13px;
      color: #64748b;
    }
    .timeline-content .time {
      font-size: 11px;
      color: #94a3b8;
    }
  </style>
</head>
<body data-root="../" data-auth="required">
  <header id="app-header"></header>

  <main class="orders-page">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
      <div>
        <h1 style="margin: 0; font-size: 24px;">📦 Đơn hàng của tôi</h1>
        <p class="muted" style="margin: 4px 0 0;">Theo dõi tiến độ giao hàng và quản lý huỷ đơn hàng dễ dàng.</p>
      </div>
      <div>
        <a href="cart.html" class="btn btn-small" style="text-decoration: none;">🛒 Giỏ hàng</a>
        <a href="shop-public.html" class="btn btn-small btn-primary" style="text-decoration: none;">🏪 Mua thêm</a>
      </div>
    </div>

    <!-- Tabs trạng thái -->
    <div class="order-status-tabs" id="status-tabs">
      <button class="status-tab-btn active" data-status="">Tất cả</button>
      <button class="status-tab-btn" data-status="PENDING">Chờ xác nhận</button>
      <button class="status-tab-btn" data-status="CONFIRMED">Đã xác nhận</button>
      <button class="status-tab-btn" data-status="SHIPPED">Đang vận chuyển</button>
      <button class="status-tab-btn" data-status="DELIVERED">Hoàn thành</button>
      <button class="status-tab-btn" data-status="CANCELLED">Đã huỷ</button>
    </div>

    <!-- Danh sách đơn hàng -->
    <div id="orders-list-container">
      <div class="card muted" style="text-align: center; padding: 40px;">Đang tải danh sách đơn hàng...</div>
    </div>
  </main>

  <!-- Modal Chi tiết Đơn hàng & Dòng thời gian trạng thái -->
  <div id="order-detail-modal" class="modal-overlay" style="display: none;">
    <div class="card" style="max-width: 620px; width: 90%; max-height: 90vh; overflow-y: auto; position: relative;">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 16px;">
        <h3 id="modal-order-title" style="margin: 0;">Chi tiết đơn hàng</h3>
        <button type="button" id="btn-close-modal" class="btn btn-small" style="border: none; background: none; font-size: 18px; cursor: pointer;">✕</button>
      </div>

      <!-- Dòng thời gian trạng thái -->
      <h4 style="margin: 12px 0 6px;">⏱️ Dòng thời gian trạng thái</h4>
      <div class="timeline-container" id="modal-timeline-box"></div>

      <!-- Thông tin nhận hàng -->
      <h4 style="margin: 16px 0 6px;">📍 Thông tin giao hàng</h4>
      <div id="modal-shipping-info" class="muted" style="font-size: 13px; background: #f8fafc; padding: 12px; border-radius: 8px;"></div>

      <!-- Danh sách sản phẩm -->
      <h4 style="margin: 16px 0 6px;">🛍️ Sản phẩm</h4>
      <div id="modal-items-list" style="margin-bottom: 16px;"></div>

      <div style="text-align: right; border-top: 1px solid #e2e8f0; padding-top: 14px;">
        <span class="muted">Tổng thanh toán: </span>
        <strong id="modal-total-amount" style="font-size: 18px; color: #dc2626;">0 ₫</strong>
      </div>
    </div>
  </div>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js?v=3"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/orders.js"></script>
</body>
</html>
