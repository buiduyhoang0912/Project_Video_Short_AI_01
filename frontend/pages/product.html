<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chi tiết sản phẩm – ShortAI</title>
  <link rel="stylesheet" href="../css/style.css?v=3" />
  <style>
    body { background: #f5f5f5; }
    .product-detail-page { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
    .breadcrumb { font-size: 0.82rem; color: #888; margin-bottom: 16px; }
    .breadcrumb a { color: #6366f1; text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }

    /* Detail layout */
    .product-detail-layout {
      display: grid; grid-template-columns: 420px 1fr; gap: 28px;
      background: #fff; border-radius: 12px; padding: 24px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08); margin-bottom: 24px;
    }
    @media (max-width: 800px) {
      .product-detail-layout { grid-template-columns: 1fr; }
    }

    /* Gallery */
    .gallery-main {
      width: 100%; aspect-ratio: 1; border-radius: 10px; overflow: hidden;
      background: #f0f0f0; margin-bottom: 10px;
    }
    .gallery-main img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity 0.2s; }
    .gallery-thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
    .gallery-thumbs img {
      width: 64px; height: 64px; object-fit: cover; border-radius: 6px;
      border: 2px solid transparent; cursor: pointer; transition: border 0.18s;
    }
    .gallery-thumbs img.active { border-color: #6366f1; }
    .gallery-thumbs img:hover { border-color: #a5b4fc; }

    /* Info panel */
    .detail-info { display: flex; flex-direction: column; gap: 14px; }
    .detail-name { font-size: 1.35rem; font-weight: 700; color: #111; line-height: 1.4; }
    .detail-meta { display: flex; gap: 16px; font-size: 0.84rem; color: #888; }
    .detail-meta span { display: flex; align-items: center; gap: 4px; }
    .detail-price-box {
      background: #fef2f2; border-radius: 8px; padding: 14px 18px; display: flex;
      align-items: baseline; gap: 12px;
    }
    .detail-price { font-size: 1.8rem; font-weight: 800; color: #e53e3e; }
    .detail-price-orig { font-size: 1rem; color: #aaa; text-decoration: line-through; }
    .detail-stock { font-size: 0.9rem; color: #555; }
    .detail-stock span { font-weight: 700; color: #22c55e; }
    .detail-stock.out span { color: #ef4444; }

    /* Quantity */
    .qty-label { font-size: 0.9rem; font-weight: 600; color: #333; margin-bottom: 6px; }
    .qty-control { display: flex; align-items: center; gap: 0; border: 1px solid #ddd; border-radius: 7px; overflow: hidden; width: fit-content; }
    .qty-control button {
      width: 38px; height: 38px; border: none; background: #f5f5f5; font-size: 1.1rem;
      cursor: pointer; transition: background 0.15s; font-weight: 700; color: #333;
    }
    .qty-control button:hover { background: #e0e0e0; }
    .qty-control button:disabled { opacity: 0.4; cursor: default; }
    .qty-control input {
      width: 54px; height: 38px; border: none; border-left: 1px solid #ddd;
      border-right: 1px solid #ddd; text-align: center; font-size: 1rem;
      font-weight: 600; outline: none;
    }
    /* Remove number arrows */
    .qty-control input::-webkit-outer-spin-button,
    .qty-control input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    /* Action buttons */
    .detail-actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn-add-cart {
      flex: 1; padding: 13px 20px; border-radius: 8px; border: 2px solid #6366f1;
      background: #fff; color: #6366f1; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: all 0.18s;
    }
    .btn-add-cart:hover { background: #ede9fe; }
    .btn-buy-now {
      flex: 1; padding: 13px 20px; border-radius: 8px; border: none;
      background: #6366f1; color: #fff; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: background 0.18s;
    }
    .btn-buy-now:hover { background: #4f46e5; }
    .btn-add-cart:disabled, .btn-buy-now:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Description */
    .detail-desc-section { background: #fff; border-radius: 12px; padding: 20px 24px; box-shadow: 0 1px 6px rgba(0,0,0,0.07); margin-bottom: 20px; }
    .detail-desc-section h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 12px; color: #222; }
    .detail-desc { font-size: 0.9rem; color: #444; line-height: 1.7; white-space: pre-line; }

    /* Shop info card */
    .shop-info-card {
      background: #fff; border-radius: 12px; padding: 18px 20px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.07); display: flex;
      align-items: center; gap: 16px; margin-bottom: 20px;
    }
    .shop-info-card img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid #e0e0e0; }
    .shop-info-name { font-weight: 700; font-size: 1rem; color: #222; margin-bottom: 4px; }
    .shop-info-link { font-size: 0.84rem; color: #6366f1; text-decoration: none; }
    .shop-info-link:hover { text-decoration: underline; }

  </style>
</head>
<body data-root="../">
  <header id="app-header"></header>

  <div class="product-detail-page">
    <div class="breadcrumb">
      <a href="shop.html">🛍️ Cửa hàng</a> &rsaquo; <span id="breadcrumb-name">Đang tải...</span>
    </div>

    <!-- Main detail block -->
    <div class="product-detail-layout" id="detail-layout">
      <!-- Gallery -->
      <div>
        <div class="gallery-main"><img id="gallery-main-img" src="" alt="Ảnh sản phẩm" /></div>
        <div class="gallery-thumbs" id="gallery-thumbs"></div>
      </div>

      <!-- Info -->
      <div class="detail-info">
        <div class="detail-name" id="detail-name">Đang tải...</div>
        <div class="detail-meta">
          <span>⭐ <span id="detail-sold">0</span> đã bán</span>
          <span>📦 Kho: <span id="detail-stock-val">0</span></span>
          <span id="detail-category-badge"></span>
        </div>
        <div class="detail-price-box">
          <div class="detail-price" id="detail-price">0 ₫</div>
        </div>
        <div class="detail-stock" id="detail-stock-status">
          Còn hàng: <span id="detail-stock-num">0</span>
        </div>

        <div>
          <div class="qty-label">Số lượng:</div>
          <div class="qty-control">
            <button id="qty-minus">−</button>
            <input type="number" id="qty-input" value="1" min="1" max="1" />
            <button id="qty-plus">+</button>
          </div>
        </div>

        <div class="detail-actions">
          <button class="btn-add-cart" id="btn-add-cart">🛒 Thêm vào giỏ</button>
          <button class="btn-buy-now" id="btn-buy-now">⚡ Mua ngay</button>
        </div>
      </div>
    </div>

    <!-- Shop card -->
    <div class="shop-info-card" id="shop-info-card" style="display:none">
      <img id="shop-logo" src="" alt="Shop logo" />
      <div>
        <div class="shop-info-name" id="shop-name"></div>
        <a class="shop-info-link" id="shop-link" href="#">Xem tất cả sản phẩm của shop →</a>
      </div>
    </div>

    <!-- Description -->
    <div class="detail-desc-section">
      <h3>Mô tả sản phẩm</h3>
      <div class="detail-desc" id="detail-desc">Đang tải...</div>
    </div>
  </div>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js?v=3"></script>
  <script src="../js/utils.js?v=3"></script>
  <script src="../js/layout.js?v=3"></script>
  <script src="../js/pages/product.js?v=3"></script>
</body>
</html>
