<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chỉnh sửa hồ sơ | ClipShop AI</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <link rel="stylesheet" href="../css/style.css?v=3">
</head>
<body data-root="../" data-auth="required">
  <header id="app-header"></header>

  <main class="container">
    <section class="card form-card">
      <h1>Chỉnh sửa hồ sơ</h1>
      <div id="edit-loading" class="muted">Đang tải hồ sơ...</div>

      <form id="profile-form" novalidate style="display:none;">
        <div class="avatar-edit">
          <img id="avatar-preview" src="../assets/images/logo.svg" alt="Xem trước avatar" class="profile-avatar-large">
          <div class="avatar-edit-input">
            <label for="avatar-input" style="margin-top:0;">Ảnh đại diện</label>
            <input type="file" id="avatar-input" accept="image/jpeg,image/png">
            <div class="muted">Chỉ nhận JPG hoặc PNG, tối đa 2 MB.</div>
            <div class="field-error" id="err-avatar"></div>
          </div>
        </div>

        <label for="username">Username</label>
        <input type="text" id="username" disabled>
        <div class="muted">Username không thể thay đổi.</div>

        <label for="display_name">Tên hiển thị</label>
        <input type="text" id="display_name" autocomplete="nickname">
        <div class="field-error" id="err-display_name"></div>

        <label for="bio">Tiểu sử</label>
        <textarea id="bio" rows="4" placeholder="Giới thiệu ngắn về bạn..."></textarea>
        <div class="char-count muted" id="bio-count">0/500</div>
        <div class="field-error" id="err-bio"></div>

        <div class="form-error" id="form-error" role="alert"></div>
        <div class="status status-ok" id="form-success" role="status" style="display:none;"></div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="btn-save">Lưu thay đổi</button>
          <a class="btn" href="profile.html">Quay lại hồ sơ</a>
          <a class="btn" href="change-password.html">Đổi mật khẩu</a>
        </div>
      </form>
    </section>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js?v=3"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/profile-edit.js"></script>
</body>
</html>
