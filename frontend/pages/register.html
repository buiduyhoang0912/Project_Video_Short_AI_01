<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký | ClipShop AI</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <link rel="stylesheet" href="../css/style.css?v=3">
</head>
<body data-root="../">
  <header id="app-header"></header>

  <main class="container">
    <section class="card auth-card">
      <h1>Đăng ký</h1>
      <form id="register-form" novalidate>
        <label for="display_name">Tên hiển thị</label>
        <input type="text" id="display_name" maxlength="100" autocomplete="name" required>
        <div class="field-error" id="err-display_name"></div>

        <label for="username">Username</label>
        <input type="text" id="username" maxlength="50" autocomplete="username" placeholder="chữ thường, số, dấu _ (3-50 ký tự)" required>
        <div class="field-error" id="err-username"></div>

        <label for="email">Email</label>
        <input type="email" id="email" maxlength="255" autocomplete="email" required>
        <div class="field-error" id="err-email"></div>

        <label for="password">Mật khẩu</label>
        <input type="password" id="password" autocomplete="new-password" placeholder="Tối thiểu 8 ký tự" required>
        <div class="field-error" id="err-password"></div>

        <label for="confirm_password">Xác nhận mật khẩu</label>
        <input type="password" id="confirm_password" autocomplete="new-password" required>
        <div class="field-error" id="err-confirm_password"></div>

        <div class="form-error" id="form-error" role="alert"></div>
        <button type="submit" class="btn btn-primary" id="btn-submit" style="width:100%;">Đăng ký</button>
      </form>
      <p class="muted">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
    </section>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js?v=3"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/auth.js"></script>
</body>
</html>
