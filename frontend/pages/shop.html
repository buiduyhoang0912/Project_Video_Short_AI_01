<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cửa hàng – ShortAI</title>
  <link rel="stylesheet" href="../css/style.css?v=3" />
  <style>
    body { background: #f5f5f5; }
    .shop-page { max-width: 1200px; margin: 0 auto; padding: 20px 16px; }
    .page-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 18px; color: #222; }
    .filter-bar {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      background: #fff; border-radius: 10px; padding: 14px 18px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 20px;
    }
    .filter-bar input[type="text"],
    .filter-bar input[type="number"],
    .filter-bar select {
      border: 1px solid #ddd; border-radius: 6px; padding: 8px 12px;
      font-size: 0.9rem; outline: none; transition: border 0.2s;
      background: #fafafa;
    }
    .filter-bar input[type="text"]:focus,
    .filter-bar input[type="number"]:focus,
    .filter-bar select:focus { border-color: #6366f1; background: #fff; }
    #q { flex: 1 1 200px; min-width: 160px; }
    #min-price, #max-price { width: 110px; }
    #category, #sort-by { flex: 0 0 auto; }
    .btn-filter {
      background: #6366f1; color: #fff; border: none; border-radius: 6px;
      padding: 8px 20px; font-size: 0.9rem; cursor: pointer; font-weight: 600;
      transition: background 0.2s;
    }
    .btn-filter:hover { background: #4f46e5; }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 18px; margin-bottom: 24px;
    }
    .product-card {
      background: #fff; border-radius: 10px; overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08); transition: transform 0.18s, box-shadow 0.18s;
      cursor: pointer; text-decoration: none; display: block; color: inherit;
    }
    .product-card:hover { transform: translateY(-3px); box-shadow: 0 4px 16px rgba(99,102,241,0.15); }
    .product-card img {
      width: 100%; aspect-ratio: 1; object-fit: cover; display: block;
      background: #f0f0f0;
    }
    .product-card-body { padding: 10px 12px 14px; }
    .product-card-name {
      font-size: 0.88rem; font-weight: 600; color: #222;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; margin-bottom: 6px; line-height: 1.4;
    }
    .product-card-price { font-size: 1rem; font-weight: 700; color: #e53e3e; }
    .product-card-meta { font-size: 0.75rem; color: #888; margin-top: 4px; }
    .product-card-shop { font-size: 0.75rem; color: #6366f1; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pagination {
      display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;
      margin-top: 10px; padding-bottom: 30px;
    }
    .pagination button {
      border: 1px solid #ddd; background: #fff; border-radius: 6px;
      padding: 7px 14px; font-size: 0.88rem; cursor: pointer; transition: all 0.18s;
    }
    .pagination button:hover { border-color: #6366f1; color: #6366f1; }
    .pagination button.active { background: #6366f1; color: #fff; border-color: #6366f1; font-weight: 700; }
    .pagination button:disabled { opacity: 0.4; cursor: default; }
    .empty-state { text-align: center; padding: 60px 20px; color: #aaa; font-size: 1rem; }
    .skeleton-card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .skeleton-img { width: 100%; aspect-ratio: 1; background: linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
    .skeleton-line { height: 12px; border-radius: 4px; margin: 10px 12px 6px; background: linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
    .skeleton-line.short { width: 60%; margin-top: 4px; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  </style>
</head>
<body data-root="../">
  <header id="app-header"></header>

  <div class="shop-page">
    <div class="page-title">🛍️ Cửa hàng</div>

    <!-- Filter bar -->
    <div class="filter-bar">
      <input type="text" id="q" placeholder="Tìm sản phẩm..." />
      <select id="category">
        <option value="">Tất cả danh mục</option>
      </select>
      <input type="number" id="min-price" placeholder="Giá từ" min="0" />
      <input type="number" id="max-price" placeholder="Giá đến" min="0" />
      <select id="sort-by">
        <option value="newest">Mới nhất</option>
        <option value="best_selling">Bán chạy</option>
        <option value="price_asc">Giá tăng dần</option>
        <option value="price_desc">Giá giảm dần</option>
      </select>
      <button class="btn-filter" id="btn-filter">🔍 Lọc</button>
    </div>

    <!-- Product grid -->
    <div id="product-grid" class="product-grid"></div>

    <!-- Pagination -->
    <div id="pagination" class="pagination"></div>
  </div>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js?v=3"></script>
  <script src="../js/utils.js?v=3"></script>
  <script src="../js/layout.js?v=3"></script>
  <script src="../js/pages/shop.js?v=3"></script>
</body>
</html>
